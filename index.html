<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Synthetix® - Beyond Prompt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      background-color: #d8e3ed;
    }

    .hero-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 32%, #f4f8fd 0%, #d5e3f1 50%, #c4d5e7 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 60px;
      overflow: hidden;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 20;
    }

    .logo-wrap {
      display: flex;
      align-items: flex-start;
    }

    .brand-logo {
      font-size: clamp(3.2rem, 9.5vw, 9rem);
      font-weight: 900;
      line-height: 0.82;
      color: #0c1117;
      letter-spacing: -0.05em;
    }

    .registered-mark {
      font-size: clamp(0.9rem, 1.8vw, 1.6rem);
      font-weight: 600;
      margin-left: 6px;
      margin-top: 4px;
      color: #0c1117;
    }

    .nav-container {
      display: flex;
      align-items: center;
      gap: 32px;
      margin-top: 15px;
    }

    .nav-links {
      display: flex;
      gap: 26px;
    }

    .nav-link {
      text-decoration: none;
      color: #1a202c;
      font-size: 0.95rem;
      font-weight: 500;
      transition: opacity 0.2s, transform 0.2s;
    }

    .nav-link:hover {
      opacity: 0.55;
      transform: translateY(-1px);
    }

    .menu-btn {
      width: 38px;
      height: 38px;
      background-color: #0c1117;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      border: none;
      transition: transform 0.25s ease;
    }

    .menu-btn:hover {
      transform: scale(1.08) rotate(90deg);
    }

    .menu-btn span {
      display: block;
      width: 14px;
      height: 1.5px;
      background-color: #ffffff;
      border-radius: 1px;
    }

    .slogan-box {
      position: absolute;
      top: 155px;
      right: 22%;
      z-index: 10;
    }

    .slogan-title {
      font-size: clamp(2.3rem, 4.5vw, 4.3rem);
      font-weight: 800;
      line-height: 1.05;
      color: #0c1117;
      letter-spacing: -0.04em;
    }

    .core-viewport {
      position: absolute;
      top: 52%;
      left: 50%;
      width: 550px;
      height: 550px;
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }

    .core-stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: coreFloat 7s ease-in-out infinite;
      transition: transform 0.12s cubic-bezier(0.1, 0.5, 0.1, 1);
      transform-style: preserve-3d;
    }

    .core-halo {
      position: absolute;
      width: 460px;
      height: 460px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(165, 210, 255, 0.45) 0%, rgba(215, 235, 255, 0.1) 55%, transparent 70%);
      filter: blur(28px);
      z-index: 1;
      animation: pulseAura 5s ease-in-out infinite alternate;
    }

    .crystal-core {
      position: relative;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 25%, 
        rgba(255, 255, 255, 0.98) 0%, 
        rgba(230, 242, 255, 0.6) 25%, 
        rgba(170, 205, 235, 0.25) 55%, 
        rgba(255, 255, 255, 0.8) 100%);
      box-shadow: 
        inset 0 12px 30px rgba(255, 255, 255, 0.9),
        inset 0 -18px 36px rgba(75, 120, 165, 0.35),
        0 25px 60px rgba(45, 80, 120, 0.2);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1.5px solid rgba(255, 255, 255, 0.75);
      z-index: 4;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .inner-matrix {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: radial-gradient(circle, rgba(255,255,255,0.7) 0%, rgba(185, 220, 250, 0.15) 70%);
      filter: blur(1px);
      animation: innerRotate 12s linear infinite;
    }

    .orbit-ring {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 3;
    }

    .ring-cyan {
      width: 520px;
      height: 520px;
      border: 2px dashed rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 20px rgba(160, 220, 255, 0.85), inset 0 0 12px rgba(160, 220, 255, 0.6);
      transform: rotateX(70deg) rotateY(18deg);
      animation: spinCyan 20s linear infinite;
    }

    .ring-gold {
      width: 470px;
      height: 470px;
      border: 2px solid rgba(255, 215, 160, 0.85);
      box-shadow: 0 0 22px rgba(255, 205, 130, 0.7);
      transform: rotateX(72deg) rotateY(-28deg);
      animation: spinGold 26s linear infinite reverse;
    }

    .ring-micro {
      width: 400px;
      height: 400px;
      border: 1.5px dotted rgba(230, 245, 255, 0.9);
      box-shadow: 0 0 14px rgba(210, 235, 255, 0.6);
      transform: rotateX(62deg) rotateY(42deg);
      animation: spinCyan 15s linear infinite;
    }

    @keyframes coreFloat {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-16px) rotate(0.6deg);
      }
    }

    @keyframes pulseAura {
      0% { transform: scale(0.92); opacity: 0.55; }
      100% { transform: scale(1.08); opacity: 0.85; }
    }

    @keyframes spinCyan {
      from { transform: rotateX(70deg) rotateY(18deg) rotateZ(0deg); }
      to { transform: rotateX(70deg) rotateY(18deg) rotateZ(360deg); }
    }

    @keyframes spinGold {
      from { transform: rotateX(72deg) rotateY(-28deg) rotateZ(0deg); }
      to { transform: rotateX(72deg) rotateY(-28deg) rotateZ(360deg); }
    }

    @keyframes innerRotate {
      from { transform: rotate(0deg) scale(0.95); }
      50% { transform: rotate(180deg) scale(1.05); }
      to { transform: rotate(360deg) scale(0.95); }
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 20;
    }

    .bottom-description {
      font-size: 0.95rem;
      font-weight: 600;
      color: #0c1117;
      letter-spacing: -0.01em;
      max-width: 360px;
      line-height: 1.45;
    }

    .cta-group {
      display: flex;
      gap: 12px;
    }

    .pill-btn {
      display: inline-block;
      padding: 13px 28px;
      background-color: #0c1117;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 9999px;
      transition: all 0.25s ease;
      box-shadow: 0 5px 16px rgba(0, 0, 0, 0.14);
    }

    .pill-btn:hover {
      background-color: #242c38;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
    }

    @media (max-width: 860px) {
      .hero-container { padding: 30px 24px; }
      .nav-links { display: none; }
      .slogan-box { top: 125px; right: 24px; }
      .core-viewport { width: 360px; height: 360px; }
      .crystal-core { width: 180px; height: 180px; }
      .ring-cyan { width: 340px; height: 340px; }
      .ring-gold { width: 300px; height: 300px; }
      .ring-micro { width: 260px; height: 260px; }
      .footer { flex-direction: column-reverse; align-items: flex-start; gap: 24px; }
    }
  </style>
</head>
<body>

  <main class="hero-container" id="hero">
    <header class="header">
      <div class="logo-wrap">
        <h1 class="brand-logo">Synthetix</h1>
        <span class="registered-mark">®</span>
      </div>

      <div class="nav-container">
        <nav class="nav-links">
          <a href="#foundation" class="nav-link">Foundation</a>
          <a href="#multimodal" class="nav-link">Multimodal</a>
          <a href="#docs" class="nav-link">Docs</a>
        </nav>
        <button class="menu-btn" aria-label="Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <div class="slogan-box">
      <h2 class="slogan-title">
        Beyond<br>Prompt.
      </h2>
    </div>

    <div class="core-viewport">
      <div class="core-stage" id="coreStage">
        <div class="core-halo"></div>
        <div class="orbit-ring ring-cyan"></div>
        <div class="orbit-ring ring-gold"></div>
        <div class="orbit-ring ring-micro"></div>
        <div class="crystal-core">
          <div class="inner-matrix"></div>
        </div>
      </div>
    </div>

    <footer class="footer">
      <p class="bottom-description">
        Continuous multimodal inference, latent cognitive diffusion, and fluid generative workflows.
      </p>

      <div class="cta-group">
        <a href="#studio" class="pill-btn">Synthetix® Studio</a>
        <a href="#sandbox" class="pill-btn">API Sandbox</a>
      </div>
    </footer>
  </main>

  <script>
    const hero = document.getElementById('hero');
    const stage = document.getElementById('coreStage');

    hero.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      const rotateY = (e.clientX / innerWidth - 0.5) * 32;
      const rotateX = (e.clientY / innerHeight - 0.5) * -32;
      stage.style.transform = `perspective(900px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    hero.addEventListener('mouseleave', () => {
      stage.style.transform = `perspective(900px) rotateX(0deg) rotateY(0deg)`;
    });
  </script>

</body>
</html>
